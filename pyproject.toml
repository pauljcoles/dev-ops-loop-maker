[project]
name = "loopgen"
version = "0.1.0"
description = "Makes a DevOps infinity loop from a YAML file. Writes plain SVG."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6"]

[project.scripts]
loopgen = "loopgen:main"

[project.urls]
Homepage = "https://github.com/pauljcoles/dev-ops-loop-maker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the whole tool is one module at the repo root
only-include = ["loopgen.py"]
sources = ["."]
