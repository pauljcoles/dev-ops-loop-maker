# Demonstrates the full option set: the rings curve, arrow segments with one
# emphasised feedback edge, quadrant callouts, and wrapped bullet notes.
title: Delivery lifecycle
lobes:
  left: Dev
  right: Ops
stages:
  - name: Plan
    label: Shape the work
    colour: "#1f7fd4"
    note: "Agree the problem\nSize the outcome\nPick a success measure"
  - name: Code
    label: Build it
    colour: "#1cb0d8"
    note: "Small changes\nReview before merge\nKeep it reversible"
  - name: Build
    label: Package
    colour: "#17b6b0"
    note: "Reproducible builds\nPin dependencies\nScan for vulnerabilities"
  - name: Test
    label: Check it works
    colour: "#25c485"
    note: "Automated suites\nCover the risky paths\nFail fast and loudly"
  - name: Release
    label: Approve
    colour: "#8cc63e"
    note: "Change record raised\nSign-off captured\nRollback plan ready"
  - name: Deploy
    label: Ship safely
    colour: "#f5b120"
    note: "Progressive rollout\nGuardrails per environment\nOne switch to stop it"
  - name: Operate
    label: Run it
    colour: "#e8452c"
    note: "Watch the golden signals\nHandle incidents\nKeep costs in view"
  - name: Monitor
    label: Learn and feed back
    colour: "#c2278d"
    # a deeper chevron than the rest marks the feedback edge closing the loop
    arrow_depth: 96
    note: "Measure real usage\nCompare against the goal\nSend findings back to Plan"
style:
  width: 2300
  height: 1300
  scale: 640
  curve: rings
  ring_ratio: 0.6
  reverse: true
  offset: 5.5
  ribbon_width: 112
  segment_style: arrow
  arrow_depth: 46
  badge_layout: quadrant
  row_margin: 46
  badge_radius: 38
  badge_label_size: 27
  note_size: 25
  note_wrap: 30
  note_bullet: "· "
  note_colour: "#9aa4ab"
  background: "#14191d"
  band_label_colour: "#ffffff"
  label_size: 26
  title_size: 40
  title_colour: "#ffffff"
  loop_label_size: 62
  loop_icon_colour: "#ffffff"
  loop_icon_stroke: 4
  grid: true
  grid_colour: "#ffffff"
  grid_opacity: 0.45
  grid_dash: "4,11"
